name: Send Email

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'

jobs:
  send_email:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::readr
            any::lubridate
            any::glue
            any::gmailr

      - name: Run R Script
        run: Rscript R/Astral_Report.R
        working-directory: ${{ github.workspace }}

      - name: Debug email body
        run: |
          echo "----- EMAIL BODY -----"
          cat email_body.txt
          echo "----------------------"

      - name: Check files
        run: |
          ls -lah
          wc -l email_body.txt
          wc -l email_subject.txt
    
      - name: Read Subject and Body
        id: read_email_content
        run: |
          echo "email_subject=$(cat email_subject.txt)" >> $GITHUB_OUTPUT
      
          echo "email_body<<ASTRALREPORTEND" >> $GITHUB_OUTPUT
          cat email_body.txt >> $GITHUB_OUTPUT
          echo "ASTRALREPORTEND" >> $GITHUB_OUTPUT

      - name: Send Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_FROM }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ steps.read_email_content.outputs.email_subject }}
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_FROM }}
          html_body: ${{ steps.read_email_content.outputs.email_body }}
